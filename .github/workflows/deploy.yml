name: Deploy to OVH (FTP)

on:
  push:
    branches: [php]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint PHP files
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Generate config.php from secrets
        run: |
          cat > config.php <<EOF
          <?php
          return array(
              'prim_api_key' => ${{ toJSON(secrets.PRIM_API_KEY) }},
          );
          EOF

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ vars.FTP_SERVER_DIR || 'www/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            arrets-lignes.csv
            cache/**
            README.md
            LICENSE
            config.sample.php
            data/stop_id_overrides.json
